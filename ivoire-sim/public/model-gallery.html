<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ivoire Sim — Modèles 3D</title>
  <script type="importmap">
  {"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}
  </script>
  <style>
    :root{color-scheme:dark;--bg:#101a2a;--panel:#17263b;--line:#2d405d;--text:#eef3fb;--muted:#a8b8ce;--orange:#ff7a00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Segoe UI,sans-serif}
    header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:#0c1422}
    header a{color:#fff;text-decoration:none}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:minmax(260px,340px) 1fr;min-height:calc(100vh - 58px)}
    aside{padding:14px;border-right:1px solid var(--line);overflow:auto}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .filter,.asset{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;cursor:pointer}
    .filter{padding:6px 9px}.filter.active,.asset.active{border-color:var(--orange);background:#26374e}
    #assets{display:grid;gap:6px}.asset{text-align:left;padding:9px 10px}.asset small{display:block;color:var(--muted);margin-top:3px}
    .viewer{position:relative;min-height:65vh;background:radial-gradient(ellipse at center,#293b51,#111a29 70%)}
    #preview{position:absolute;inset:0;width:100%;height:100%;display:block}.status{position:absolute;left:16px;bottom:14px;padding:8px 12px;background:#0c1422d9;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
    .hint{padding:14px 18px;color:var(--muted)}@media(max-width:720px){main{grid-template-columns:1fr;grid-template-rows:minmax(220px,38vh) 1fr}.viewer{grid-row:1;min-height:220px}aside{border-right:0;border-top:1px solid var(--line)}#assets{grid-template-columns:repeat(2,minmax(0,1fr))}.asset{font-size:13px}}
  </style>
</head>
<body>
  <header><a href="city3d.html">← Retour à la ville</a><h1>🏗️ Galerie des nouveaux modèles</h1></header>
  <main>
    <aside>
      <div class="filters" id="filters" aria-label="Filtrer les modèles"></div>
      <div id="assets"></div>
    </aside>
    <section class="viewer" aria-label="Aperçu 3D">
      <canvas id="preview"></canvas>
      <div class="status" id="status" role="status">Chargement du modèle…</div>
    </section>
  </main>
  <p class="hint">Glisse pour tourner le modèle, utilise la molette pour zoomer. Les modèles Grab3D sont sous licence CC0.</p>
  <script type="module" src="assets/model-gallery.js"></script>
</body>
</html>
